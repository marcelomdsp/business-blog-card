<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Business Blog Card</title>
  </head>
  <body>
    <div class="container">

      <div class="card">
        <div class="image"><img src="./img/hero-image-1.jpg" alt="Blog Post Image" />
            <svg class="svg-overlay" src="./img/white-overlay.svg" alt="overlay" />
        </div>

        <div class="content">
          <h1 class="title">Perfect solution for small business</h1>
          <p class="description">
            Small businesses need to generate leads to grow. You can use tools
            like Ringy.
          </p>
          <div class="avatar">
            <img src="./img/avatar-image-business-card.png" alt="Author Avatar" />
            <div class="author-info">
              <h2 class="author-name">Amy Burgess</h2>
              <p class="author-title">Customer Manger, Solution Oy</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
